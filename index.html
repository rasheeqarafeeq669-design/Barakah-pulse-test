<!DOCTYPE html>
<html>
<head>
    <title>Barakah Pulse Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { text-align: center; font-family: sans-serif; background: #f0f2f5; padding: 20px; margin: 0; }
        .card { background: white; padding: 25px; border-radius: 25px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); display: inline-block; width: 100%; max-width: 350px; margin-top: 20px; }
        #bpm { font-size: 75px; font-weight: bold; color: #ff4757; margin: 0; line-height: 1.2; }
        .label { font-size: 14px; color: #747d8c; text-transform: uppercase; }
        #status { font-size: 14px; color: #57606f; margin: 15px 0; font-weight: 500; min-height: 20px; }
        #tick { display: none; font-size: 50px; color: #2ed573; margin-top: 10px; }
        video { width: 1px; height: 1px; opacity: 0; position: absolute; }
        #flash-btn { padding: 12px; border-radius: 12px; border: none; background: #2f3542; color: white; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; }
        .progress-bar { width: 100%; background: #eee; height: 8px; border-radius: 4px; margin-top: 10px; overflow: hidden; }
        #progress { width: 0%; height: 100%; background: #2ed573; transition: width 0.3s; }
    </style>
</head>
<body>
    <div class="card">
        <div id="heart" style="font-size: 40px;">❤️</div>
        <div id="bpm">--</div>
        <div class="label">BPM</div>
        <div id="tick">✅</div>
        
        <div class="progress-bar"><div id="progress"></div></div>
        <div id="status">Starting camera...</div>
        
        <button id="flash-btn">🔦 Toggle Flash</button>
        <video id="v" autoplay playsinline></video>
        <canvas id="c" width="30" height="30" style="display:none;"></canvas>
    </div>

    <script>
        const v = document.getElementById('v');
        const c = document.getElementById('c');
        const ctx = c.getContext('2d', { alpha: false });
        const bpmDisplay = document.getElementById('bpm');
        const statusDisplay = document.getElementById('status');
        const tickDisplay = document.getElementById('tick');
        const progressBar = document.getElementById('progress');
        
        let frames = [];
        let track;
        let isComplete = false;
        let startTime = null;
        let finalBPM = "--";
        const MEASURE_TIME = 10; 

        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: 160, height: 120 } })
            .then(stream => {
                v.srcObject = stream;
                track = stream.getVideoTracks()[0];
                statusDisplay.innerText = "Place finger firmly";
                requestAnimationFrame(process);
            });

        document.getElementById('flash-btn').addEventListener('click', () => {
            if (track) {
                const s = track.getSettings();
                track.applyConstraints({ advanced: [{ torch: !s.torch }] }).catch(() => alert("Flash not supported"));
            }
        });

        function process() {
            if (isComplete) return;

            ctx.drawImage(v, 0, 0, 30, 30);
            const data = ctx.getImageData(0, 0, 30, 30).data;
            let r = 0, g = 0;
            for (let i = 0; i < data.length; i += 32) {
                r += data[i];
                g += data[i+1];
            }

            if (r > g * 2.0 && r > 80) { // Detection logic optimized
                if (!startTime) startTime = Date.now();
                let elapsed = (Date.now() - startTime) / 1000;
                let progressPerc = Math.min((elapsed / MEASURE_TIME) * 100, 100);
                progressBar.style.width = progressPerc + "%";

                frames.push({ v: r, t: Date.now() });
                statusDisplay.innerText = "Measuring... " + Math.max(0, Math.round(MEASURE_TIME - elapsed)) + "s";

                if (elapsed >= MEASURE_TIME) {
                    finishRecording();
                    return;
                }
            } else {
                resetAll();
            }

            if (frames.length > 80) frames.shift();
            if (frames.length > 20) {
                calculateBPM();
            }
            setTimeout(() => requestAnimationFrame(process), 60);
        }

        function calculateBPM() {
            let peaks = 0;
            for (let i = 1; i < frames.length - 1; i++) {
                if (frames[i].v > frames[i-1].v && frames[i].v > frames[i+1].v) peaks++;
            }
            let duration = (frames[frames.length-1].t - frames[0].t) / 60000;
            let bpm = Math.round(peaks / duration / 2);
            if (bpm > 45 && bpm < 155) {
                finalBPM = bpm;
                bpmDisplay.innerText = bpm;
            }
        }

        function finishRecording() {
            isComplete = true;
            bpmDisplay.innerText = finalBPM; // കൗണ്ട് ഇവിടെ ലോക്ക് ചെയ്യുന്നു
            tickDisplay.style.display = "block";
            statusDisplay.innerText = "Done!";
            statusDisplay.style.color = "#2ed573";
            progressBar.style.width = "100%";
        }

        function resetAll() {
            if (isComplete) return;
            startTime = null;
            frames = [];
            bpmDisplay.innerText = "--";
            tickDisplay.style.display = "none";
            progressBar.style.width = "0%";
            statusDisplay.innerText = "Place finger firmly";
            statusDisplay.style.color = "#57606f";
        }
    </script>
</body>
</html>
