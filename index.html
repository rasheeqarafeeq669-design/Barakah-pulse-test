<!DOCTYPE html>
<html>
<head>
    <title>Barakah Pulse Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { text-align: center; font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 20px; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: inline-block; width: 100%; max-width: 360px; margin-top: 10px; }
        #bpm { font-size: 85px; font-weight: bold; color: #ff4757; margin: 0; line-height: 1; }
        .label { font-size: 12px; color: #747d8c; text-transform: uppercase; margin-bottom: 10px; }
        .stress-box { margin-top: 20px; padding: 15px; background: #fffaf0; border-radius: 20px; border: 1px solid #ffeaa7; }
        #stress-val { font-size: 32px; font-weight: bold; color: #e67e22; }
        #status { font-size: 15px; color: #2f3542; margin: 20px 0; font-weight: 600; }
        .progress-bar { width: 100%; background: #dfe6e9; height: 12px; border-radius: 6px; overflow: hidden; }
        #progress { width: 0%; height: 100%; background: #ff4757; transition: width 0.2s; }
        button { padding: 16px; border-radius: 15px; border: none; font-weight: bold; width: 100%; cursor: pointer; margin-top: 12px; font-size: 16px; }
        #repeat-btn { display: none; background: #2ed573; color: white; }
        #flash-btn { background: #2f3542; color: white; }
        video { width: 1px; height: 1px; opacity: 0; position: absolute; }
    </style>
</head>
<body>
    <div class="card">
        <div style="font-size: 45px;">❤️</div>
        <div id="bpm">--</div>
        <div class="label">Heart Rate (BPM)</div>
        <div class="stress-box">
            <div class="label">Stress Level</div>
            <div id="stress-val">0%</div>
        </div>
        <div class="progress-bar" style="margin-top:20px;"><div id="progress"></div></div>
        <div id="status">Starting camera...</div>
        <button id="repeat-btn">🔄 Measure Again</button>
        <button id="flash-btn">🔦 Flash On/Off</button>
        <video id="v" autoplay playsinline></video>
        <canvas id="c" width="30" height="30" style="display:none;"></canvas>
    </div>

    <script>
        const v = document.getElementById('v'), c = document.getElementById('c'), ctx = c.getContext('2d', { alpha: false });
        const bpmDisp = document.getElementById('bpm'), stressDisp = document.getElementById('stress-val');
        const statusDisp = document.getElementById('status'), progress = document.getElementById('progress'), repeatBtn = document.getElementById('repeat-btn');
        let frames = [], track, isDone = false, startT = null, finalB = "--", finalS = "0%";

        async function init() {
            try {
                const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                v.srcObject = s; track = s.getVideoTracks()[0];
                setTimeout(() => track.applyConstraints({ advanced: [{ torch: true }] }).catch(() => {}), 1000);
                requestAnimationFrame(loop);
            } catch (e) { statusDisp.innerText = "Error: Open direct link in Chrome."; }
        }

        function loop() {
            if (isDone) return;
            ctx.drawImage(v, 0, 0, 30, 30);
            const d = ctx.getImageData(0, 0, 30, 30).data;
            let r = 0, g = 0;
            for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i+1]; }

            if (r > g * 2.0 && r > 600) {
                if (!startT) startT = Date.now();
                let dur = (Date.now() - startT) / 1000;
                progress.style.width = (dur * 10) + "%";
                statusDisp.innerText = "Measuring... " + Math.max(0, Math.round(10 - dur)) + "s";
                frames.push({ v: r, t: Date.now() });
                if (dur >= 10) { lock(); return; }
            } else {
                startT = null; frames = []; progress.style.width = "0%";
                statusDisp.innerText = "Place finger firmly on camera & flash";
            }
            if (frames.length > 20) update();
            requestAnimationFrame(loop);
        }

        function update() {
            let p = 0;
            for (let i = 1; i < frames.length - 1; i++) if (frames[i].v > frames[i-1].v && frames[i].v > frames[i+1].v) p++;
            let b = Math.round(p / ((frames[frames.length-1].t - frames[0].t) / 60000) / 2);
            if (b > 45 && b < 160) {
                finalB = b; finalS = Math.min(Math.max(Math.round((b - 60) * 1.3), 5), 98) + "%";
                bpmDisp.innerText = finalB; stressDisp.innerText = finalS;
            }
        }

        function lock() {
            isDone = true; bpmDisp.innerText = finalB; stressDisp.innerText = finalS;
            statusDisp.innerText = "✅ Done!"; repeatBtn.style.display = "block"; progress.style.width = "100%";
        }

        document.getElementById('flash-btn').onclick = () => {
            if (track) {
                const s = track.getSettings();
                track.applyConstraints({ advanced: [{ torch: !s.torch }] }).catch(() => alert("Open GitHub link directly in Chrome for Flash."));
            }
        };

        repeatBtn.onclick = () => location.reload();
        init();
    </script>
</body>
</html>
