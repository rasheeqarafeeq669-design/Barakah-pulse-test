<!DOCTYPE html>
<html>
<head>
    <title>Barakah Pulse Ultra</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { text-align: center; font-family: sans-serif; background: #f0f2f5; padding: 20px; margin: 0; }
        .card { background: white; padding: 25px; border-radius: 25px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); display: inline-block; width: 100%; max-width: 350px; margin-top: 20px; }
        #bpm { font-size: 70px; font-weight: bold; color: #ff4757; margin: 0; line-height: 1; }
        .label { font-size: 14px; color: #747d8c; text-transform: uppercase; margin-bottom: 10px; }
        .stress-box { margin-top: 20px; padding: 15px; background: #fff5f5; border-radius: 15px; border: 1px solid #ffe6e6; }
        #stress-val { font-size: 24px; font-weight: bold; color: #ffa502; }
        #status { font-size: 13px; color: #57606f; margin: 15px 0; min-height: 18px; font-weight: 500; }
        video { width: 1px; height: 1px; opacity: 0; position: absolute; }
        #flash-btn { padding: 12px; border-radius: 12px; border: none; background: #2f3542; color: white; font-weight: bold; width: 100%; cursor: pointer; font-size: 16px; }
        .heart-icon { font-size: 40px; margin-bottom: 10px; transition: transform 0.2s; }
    </style>
</head>
<body>
    <div class="card">
        <div id="heart" class="heart-icon">❤️</div>
        <div id="bpm">--</div>
        <div class="label">Heart Rate (BPM)</div>
        <div class="stress-box">
            <div class="label">Estimated Stress</div>
            <div id="stress-val">0%</div>
        </div>
        <div id="status">Starting camera...</div>
        <button id="flash-btn">🔦 Toggle Flash</button>
        <video id="v" autoplay playsinline></video>
        <canvas id="c" width="30" height="30" style="display:none;"></canvas>
    </div>

    <script>
        const v = document.getElementById('v');
        const c = document.getElementById('c');
        const ctx = c.getContext('2d', { alpha: false });
        const bpmDisplay = document.getElementById('bpm');
        const stressDisplay = document.getElementById('stress-val');
        const statusDisplay = document.getElementById('status');
        const heartIcon = document.getElementById('heart');
        let frames = [];
        let track;

        // ലാഗ് കുറയ്ക്കാൻ വളരെ ചെറിയ റെസല്യൂഷൻ ഉപയോഗിക്കുന്നു
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: 160, height: 120 } })
            .then(stream => {
                v.srcObject = stream;
                track = stream.getVideoTracks()[0];
                statusDisplay.innerText = "Place finger on camera & flash";
                requestAnimationFrame(process);
            }).catch(() => statusDisplay.innerText = "Camera Access Error");

        document.getElementById('flash-btn').addEventListener('click', () => {
            if (track) {
                const s = track.getSettings();
                track.applyConstraints({ advanced: [{ torch: !s.torch }] }).catch(() => {});
            }
        });

        function process() {
            // ലാഗ് ഒഴിവാക്കാൻ 30x30 പിക്സലിലേക്ക് ചുരുക്കി
            ctx.drawImage(v, 0, 0, 30, 30);
            const data = ctx.getImageData(0, 0, 30, 30).data;
            
            let r = 0, g = 0;
            // Sampling speed കൂട്ടി
            for (let i = 0; i < data.length; i += 32) {
                r += data[i];
                g += data[i+1];
            }
            
            // FINGER DETECTION: വിരൽ വെച്ചാൽ മാത്രം റീഡിംഗ് എടുക്കും
            if (r > g * 2.5 && r > 100) {
                frames.push({ v: r, t: Date.now() });
                statusDisplay.innerText = "Reading pulse... Keep steady";
                heartIcon.style.transform = "scale(1.2)";
            } else {
                frames = []; 
                bpmDisplay.innerText = "--";
                stressDisplay.innerText = "0%";
                statusDisplay.innerText = "Place finger firmly on camera";
                heartIcon.style.transform = "scale(1)";
            }

            if (frames.length > 80) frames.shift();

            if (frames.length > 50) {
                let peaks = 0;
                for (let i = 1; i < frames.length - 1; i++) {
                    if (frames[i].v > frames[i-1].v && frames[i].v > frames[i+1].v) peaks++;
                }
                let duration = (frames[frames.length-1].t - frames[0].t) / 60000;
                let bpm = Math.round(peaks / duration / 2);
                
                if (bpm > 45 && bpm < 150) {
                    bpmDisplay.innerText = bpm;
                    let stress = Math.min(Math.max(bpm - 60, 5), 95);
                    stressDisplay.innerText = stress + "%";
                }
            }
            // 70ms ഗ്യാപ് നൽകുന്നത് ഫോൺ ഹാങ്ങ് ആകുന്നത് തടയും
            setTimeout(() => requestAnimationFrame(process), 70); 
        }
    </script>
</body>
</html>
