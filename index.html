<!DOCTYPE html>
<html>
<head>
    <title>Barakah Pulse - Professional</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { text-align: center; font-family: sans-serif; background: #f4f7f6; padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 25px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); display: inline-block; width: 100%; max-width: 350px; }
        #bpm { font-size: 70px; font-weight: bold; color: #ff4757; margin: 10px 0; }
        .stress-box { background: #fff5e6; padding: 15px; border-radius: 15px; margin-bottom: 15px; border: 1px solid #ffe0b3; }
        #stress-val { font-size: 30px; font-weight: bold; color: #e67e22; }
        #status { font-size: 14px; color: #555; margin-bottom: 15px; font-weight: bold; }
        .progress-bar { width: 100%; background: #eee; height: 10px; border-radius: 5px; margin-bottom: 15px; overflow: hidden; }
        #progress { width: 0%; height: 100%; background: #ff4757; transition: width 0.2s; }
        button { width: 100%; padding: 15px; border-radius: 12px; border: none; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
        #repeat-btn { display: none; background: #2ed573; color: white; }
        #flash-btn { background: #2f3542; color: white; }
        video { width: 1px; height: 1px; opacity: 0; position: absolute; }
    </style>
</head>
<body>
    <div class="card">
        <div style="font-size: 40px;">❤️</div>
        <div id="bpm">--</div>
        <div style="font-size: 12px; color: #888; text-transform: uppercase;">Heart Rate (BPM)</div>
        
        <div class="stress-box">
            <div style="font-size: 12px; color: #888;">STRESS LEVEL</div>
            <div id="stress-val">0%</div>
        </div>

        <div class="progress-bar"><div id="progress"></div></div>
        <div id="status">Place finger on camera</div>
        
        <button id="repeat-btn">🔄 Measure Again</button>
        <button id="flash-btn">🔦 Toggle Flash</button>

        <video id="v" autoplay playsinline></video>
        <canvas id="c" width="30" height="30" style="display:none;"></canvas>
    </div>

    <script>
        const v = document.getElementById('v');
        const c = document.getElementById('c');
        const ctx = c.getContext('2d');
        const bpmDisp = document.getElementById('bpm');
        const stressDisp = document.getElementById('stress-val');
        const statusDisp = document.getElementById('status');
        const progress = document.getElementById('progress');
        const repeatBtn = document.getElementById('repeat-btn');
        
        let frames = [], track, isDone = false, startT = null;
        let lastBPM = "--", lastStress = "0%";

        async function init() {
            try {
                const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                v.srcObject = s;
                track = s.getVideoTracks()[0];
                requestAnimationFrame(loop);
            } catch (e) { statusDisp.innerText = "Camera access denied!"; }
        }

        function loop() {
            if (isDone) return;
            ctx.drawImage(v, 0, 0, 30, 30);
            const d = ctx.getImageData(0, 0, 30, 30).data;
            let r = 0, g = 0;
            for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i+1]; }

            if (r > g * 2 && r > 500) {
                if (!startT) startT = Date.now();
                let dur = (Date.now() - startT) / 1000;
                progress.style.width = (dur * 10) + "%";
                statusDisp.innerText = "Measuring... " + Math.ceil(10 - dur) + "s";
                frames.push({ v: r, t: Date.now() });

                if (dur >= 10) {
                    isDone = true;
                    bpmDisp.innerText = lastBPM;
                    stressDisp.innerText = lastStress;
                    statusDisp.innerText = "✅ Done!";
                    repeatBtn.style.display = "block";
                    return;
                }
            } else {
                startT = null; frames = []; progress.style.width = "0%";
                statusDisp.innerText = "Place finger on camera";
            }

            if (frames.length > 20) {
                let p = 0;
                for (let i = 1; i < frames.length - 1; i++) {
                    if (frames[i].v > frames[i-1].v && frames[i].v > frames[i+1].v) p++;
                }
                let b = Math.round(p / ((frames[frames.length-1].t - frames[0].t) / 60000) / 2);
                if (b > 40 && b < 160) {
                    lastBPM = b;
                    lastStress = Math.min(Math.max(Math.round((b - 60) * 1.2), 5), 95) + "%";
                    bpmDisp.innerText = lastBPM;
                    stressDisp.innerText = lastStress;
                }
            }
            requestAnimationFrame(loop);
        }

        document.getElementById('flash-btn').onclick = () => {
            if (track) {
                const settings = track.getSettings();
                track.applyConstraints({ advanced: [{ torch: !settings.torch }] }).catch(() => {
                    alert("Flash blocked inside JotForm! Please open the link directly in your browser for Flash to work.");
                });
            }
        };

        repeatBtn.onclick = () => { location.reload(); };
        init();
    </script>
</body>
</html>
