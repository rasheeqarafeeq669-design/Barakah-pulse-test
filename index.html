<!DOCTYPE html>
<html>
<head>
    <title>Barakah Pulse Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { text-align: center; font-family: sans-serif; background: #f0f2f5; padding: 20px; margin: 0; }
        .card { background: white; padding: 25px; border-radius: 25px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); display: inline-block; width: 100%; max-width: 350px; margin-top: 20px; }
        #bpm { font-size: 70px; font-weight: bold; color: #ff4757; margin: 0; }
        .label { font-size: 14px; color: #747d8c; text-transform: uppercase; margin-bottom: 5px; }
        .stress-box { margin-top: 15px; padding: 10px; background: #fff5f5; border-radius: 12px; border: 1px solid #ffe6e6; }
        #stress-val { font-size: 24px; font-weight: bold; color: #ffa502; }
        #status { font-size: 14px; color: #57606f; margin: 15px 0; font-weight: 500; }
        #tick { display: none; font-size: 40px; color: #2ed573; margin: 10px 0; }
        video { width: 1px; height: 1px; opacity: 0; position: absolute; }
        button { padding: 12px; border-radius: 12px; border: none; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; font-size: 16px; }
        #repeat-btn { display: none; background: #2ed573; color: white; }
        #flash-btn { background: #2f3542; color: white; }
        .progress-bar { width: 100%; background: #eee; height: 8px; border-radius: 4px; overflow: hidden; margin-top: 10px; }
        #progress { width: 0%; height: 100%; background: #ff4757; transition: width 0.3s; }
    </style>
</head>
<body>
    <div class="card">
        <div id="heart" style="font-size: 40px;">❤️</div>
        <div id="bpm">--</div>
        <div class="label">Heart Rate (BPM)</div>
        
        <div class="stress-box">
            <div class="label">Stress Level</div>
            <div id="stress-val">0%</div>
        </div>

        <div id="tick">✅ Reading Done</div>
        <div class="progress-bar"><div id="progress"></div></div>
        <div id="status">Starting camera...</div>
        
        <button id="repeat-btn">🔄 Measure Again</button>
        <button id="flash-btn">🔦 Flash On/Off</button>

        <video id="v" autoplay playsinline></video>
        <canvas id="c" width="30" height="30" style="display:none;"></canvas>
    </div>

    <script>
        const v = document.getElementById('v');
        const c = document.getElementById('c');
        const ctx = c.getContext('2d', { alpha: false });
        const bpmDisplay = document.getElementById('bpm');
        const stressDisplay = document.getElementById('stress-val');
        const statusDisplay = document.getElementById('status');
        const tickDisplay = document.getElementById('tick');
        const progressBar = document.getElementById('progress');
        const repeatBtn = document.getElementById('repeat-btn');
        
        let frames = [];
        let track;
        let isComplete = false;
        let startTime = null;
        let lastBPM = 0;

        // Camera & Auto Flash
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
            .then(stream => {
                v.srcObject = stream;
                track = stream.getVideoTracks()[0];
                // Try auto flash
                setTimeout(() => {
                    track.applyConstraints({ advanced: [{ torch: true }] }).catch(() => {});
                }, 1000);
                requestAnimationFrame(process);
            });

        function process() {
            if (isComplete) return;

            ctx.drawImage(v, 0, 0, 30, 30);
            const data = ctx.getImageData(0, 0, 30, 30).data;
            let r = 0, g = 0;
            for (let i = 0; i < data.length; i += 32) { r += data[i]; g += data[i+1]; }

            if (r > g * 2.0 && r > 70) {
                if (!startTime) startTime = Date.now();
                let elapsed = (Date.now() - startTime) / 1000;
                progressBar.style.width = (elapsed / 10 * 100) + "%";
                
                frames.push({ v: r, t: Date.now() });
                statusDisplay.innerText = "Measuring... " + Math.max(0, Math.round(10 - elapsed)) + "s";

                if (elapsed >= 10) { finishMeasure(); return; }
            } else {
                if (!isComplete) resetData();
            }

            if (frames.length > 80) frames.shift();
            if (frames.length > 20) calculateRealtime();
            
            requestAnimationFrame(process);
        }

        function calculateRealtime() {
            let peaks = 0;
            for (let i = 1; i < frames.length - 1; i++) {
                if (frames[i].v > frames[i-1].v && frames[i].v > frames[i+1].v) peaks++;
            }
            let duration = (frames[frames.length-1].t - frames[0].t) / 60000;
            let bpm = Math.round(peaks / duration / 2);
            if (bpm > 45 && bpm < 150) {
                lastBPM = bpm;
                bpmDisplay.innerText = bpm;
                let stress = Math.min(Math.max(bpm - 60, 5), 98);
                stressDisplay.innerText = stress + "%";
            }
        }

        function finishMeasure() {
            isComplete = true;
            tickDisplay.style.display = "block";
            repeatBtn.style.display = "block";
            statusDisplay.innerText = "Measurement Completed";
            progressBar.style.width = "100%";
        }

        function resetData() {
            startTime = null;
            frames = [];
            bpmDisplay.innerText = "--";
            stressDisplay.innerText = "0%";
            progressBar.style.width = "0%";
            statusDisplay.innerText = "Place finger on camera";
        }

        repeatBtn.addEventListener('click', () => {
            isComplete = false;
            repeatBtn.style.display = "none";
            tickDisplay.style.display = "none";
            resetData();
            requestAnimationFrame(process);
        });

        document.getElementById('flash-btn').addEventListener('click', () => {
            if (track) {
                const s = track.getSettings();
                track.applyConstraints({ advanced: [{ torch: !s.torch }] }).catch(() => alert("Flash error"));
            }
        });
    </script>
</body>
</html>
