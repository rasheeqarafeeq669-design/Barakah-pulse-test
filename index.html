<script>
    function updateSimultaneous() {
        let peaks = 0;
        for (let i = 1; i < frames.length - 1; i++) {
            if (frames[i].v > frames[i-1].v && frames[i].v > frames[i+1].v) peaks++;
        }
        let duration = (frames[frames.length-1].t - frames[0].t) / 60000;
        let bpm = Math.round(peaks / duration / 2);
        
        if (bpm > 45 && bpm < 160) {
            // ഒരേ സമയം രണ്ട് ബോക്സുകളിലും വാല്യൂ മാറ്റുന്നു
            document.getElementById('bpm').innerText = bpm;
            document.getElementById('stress-val').innerText = Math.round((bpm - 60) * 1.3) + "%";
        }
    }
</script>
