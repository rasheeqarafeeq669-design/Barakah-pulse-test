<!DOCTYPE html>
<html>
<head>
    <title>Barakah Pulse Optimized</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { text-align: center; font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); display: inline-block; width: 100%; max-width: 350px; }
        #bpm { font-size: 70px; font-weight: bold; color: #ff4757; margin: 10px 0; }
        .label { font-size: 14px; color: #747d8c; text-transform: uppercase; font-weight: bold; }
        .stress-box { margin-top: 15px; padding: 15px; background: #fff5f5; border-radius: 15px; border: 1px solid #ffe6e6; }
        #stress-val { font-size: 24px; font-weight: bold; color: #ffa502; }
        #status { font-size: 12px; color: #57606f; margin-top: 15px; }
        video { width: 1px; height: 1px; opacity: 0; position: absolute; }
        button { margin-top: 15px; padding: 12px 25px; border-radius: 50px; border: none; background: #2f3542; color: white; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.2); width: 100%; }
    </style>
</head>
<body>
    <div class="card">
        <div style="font-size: 40px; animation: beat 1s infinite;">❤️</div>
        <div id="bpm">--</div>
        <div class="label">BPM</div>
        
        <div class="stress-box">
            <div class="label">Stress Level</div>
            <div id="stress-val">0%</div>
        </div>

        <button id="flash-toggle">🔦 Flash On/Off</button>
        <div id="status">Wait for camera...</div>
        
        <video id="v" autoplay playsinline></video>
        <canvas id="c" width="40" height="40" style="display:none;"></canvas>
    </div>

    <script>
        const v = document.getElementById('v');
        const c = document.getElementById('c');
        const ctx = c.getContext('2d', { alpha: false });
        const bpmDisplay = document.getElementById('bpm');
        const stressDisplay = document.getElementById('stress-val');
        const statusDisplay = document.getElementById('status');
        const flashBtn = document.getElementById('flash-toggle');
        
        let frames = [];
        let track;

        // ലാഗ് കുറയ്ക്കാൻ കുറഞ്ഞ റെസല്യൂഷനിൽ ക്യാമറ ഓപ്പൺ ചെയ്യുന്നു
        navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: 'environment', width: { ideal: 160 }, height: { ideal: 120 } } 
        })
        .then(stream => {
            v.srcObject = stream;
            track = stream.getVideoTracks()[0];
            statusDisplay.innerText = "Camera ready. Cover lens & flash.";
            requestAnimationFrame(processVideo);
        })
        .catch(() => statusDisplay.innerText = "Camera error!");

        // ഫ്ലാഷ് കൺട്രോൾ ചെയ്യാനുള്ള ഫങ്ക്ഷൻ
        flashBtn.addEventListener('click', async () => {
            if (track) {
                try {
                    const settings = track.getSettings();
                    await track.applyConstraints({ advanced: [{ torch: !settings.torch }] });
                } catch (e) {
                    alert("Flash not supported on this browser.");
                }
            }
        });

        function processVideo() {
            // ലാഗ് ഒഴിവാക്കാൻ 40x40 പിക്സലിൽ മാത്രം ഡാറ്റ അനലൈസ് ചെയ്യുന്നു
            ctx.drawImage(v, 0, 0, 40, 40);
            const data = ctx.getImageData(0, 0, 40, 40).data;
            
            let r = 0;
            // പ്രോസസ്സിംഗ് സ്പീഡ് കൂട്ടാൻ ഓരോ 4-മത്തെ പിക്സൽ മാത്രം നോക്കുന്നു
            for (let i = 0; i < data.length; i += 16) {
                r += data[i];
            }
            
            frames.push({ v: r, t: Date.now() });
            if (frames.length > 90) frames.shift();

            if (frames.length > 60) {
                let peaks = 0;
                for (let i = 1; i < frames.length - 1; i++) {
                    if (frames[i].v > frames[i-1].v && frames[i].v > frames[i+1].v) peaks++;
                }
                
                let timeSpan = (frames[frames.length-1].t - frames[0].t) / 60000;
                let bpm = Math.round(peaks / timeSpan / 2);
                
                if (bpm > 45 && bpm < 160) {
                    bpmDisplay.innerText = bpm;
                    // സ്ട്രെസ് കാൽക്കുലേഷൻ
                    let stress = Math.min(Math.max(bpm - 55, 5), 98);
                    stressDisplay.innerText = stress + "%";
                }
            }
            
            // സിപിയു ഓവർലോഡ് ഒഴിവാക്കാൻ 60ms ഗ്യാപ് നൽകുന്നു
            setTimeout(() => requestAnimationFrame(processVideo), 60);
        }
    </script>
</body>
</html>
